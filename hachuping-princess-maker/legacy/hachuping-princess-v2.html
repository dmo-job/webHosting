<title>하츄핑 프린세스 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  color-scheme:light;
  --sky:#F4EAFF;
  --ink:#4A2B5C;
  --ink-soft:#7A5A8C;
  --pink:#FF5C9E;
  --pink-deep:#E0407F;
  --pink-soft:#FFE0EE;
  --mint:#7FD9C0;
  --butter:#FFD66B;
  --gold:#D49B00;
  --card:#FFFFFF;
  --line:#EAD7F7;
  --line-deep:#D5B8EC;
  --display:'Jua','Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --body:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background-color:var(--sky);
  background-image:radial-gradient(#FFFFFF 2px,transparent 2.6px);background-size:26px 26px;
  color:var(--ink);font-family:var(--body);font-size:18px;padding-inline:16px;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid var(--butter);outline-offset:3px}
#app{max-width:1120px;margin:0 auto;padding-block:16px 28px}

/* ---------- 버튼 ---------- */
.btn{
  font-family:var(--display);font-size:22px;background:var(--card);
  border:3px solid var(--line-deep);border-bottom-width:7px;border-radius:22px;padding:12px 24px;
  transition:transform .12s ease,border-bottom-width .12s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);border-bottom-width:4px}
.btn:disabled{opacity:.4;transform:none}
.btn.pink{background:var(--pink);border-color:var(--pink-deep);color:#fff}
.btn.big{font-size:26px;padding:14px 30px}
.btn.sm{font-size:17px;padding:6px 12px;border-radius:15px;border-bottom-width:5px}
.icon{
  width:54px;height:54px;border-radius:18px;font-size:26px;flex:none;
  background:var(--card);border:3px solid var(--line-deep);border-bottom-width:6px;display:grid;place-items:center;
}
.icon:active{transform:translateY(2px);border-bottom-width:4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- 하츄핑 ---------- */
.ping{display:block;width:100%;height:auto;overflow:visible}
.bob .ping{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hop .ping{animation:hop .45s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-26px) scale(1.05,.96)}70%{transform:translateY(0) scale(1.06,.92)}100%{transform:translateY(0) scale(1)}}
@keyframes pop2{from{transform:scale(.5);opacity:0}}

/* ---------- 타이틀 ---------- */
.title-screen{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;min-height:calc(100vh - 60px);padding-block:12px}
.logo{font-family:var(--display);line-height:1;color:var(--pink);text-shadow:0 4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 -4px 0 #fff,0 8px 0 var(--line-deep)}
.logo .l1{display:block;font-size:clamp(56px,9vw,104px)}
.logo .l2{display:block;font-size:clamp(30px,4.6vw,52px);color:#9B6BD6;margin-top:8px}
.logo small{display:block;font-family:var(--body);font-size:19px;color:var(--ink-soft);text-shadow:none;margin-top:22px;line-height:1.5}
.menu{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:28px}
.menu small{font-family:var(--body);font-size:16px}
.title-ping{max-width:420px;justify-self:center;width:100%;position:relative}
.title-ping::before{content:"";position:absolute;inset:8% 4% 0;border-radius:50%;background:radial-gradient(#FFFFFF,#FFFFFF00 70%)}
.title-ping button{position:relative;background:none;border:0;padding:0;width:100%}
@media (max-width:760px){
  .title-screen{grid-template-columns:1fr;text-align:center;min-height:0}
  .menu{align-items:center}
  .title-ping{max-width:240px;grid-row:1}
}

/* ---------- 홈 ---------- */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mlabel{font-family:var(--display);display:flex;flex-direction:column;line-height:1.1;min-width:84px}
.mlabel b{font-size:28px;font-weight:400}
.mlabel span{font-size:16px;color:var(--ink-soft)}
.path{flex:1;display:flex;align-items:center;gap:5px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:8px 12px;min-width:0}
.pd{flex:1;height:26px;border-radius:999px;background:var(--pink-soft);display:grid;place-items:center;font-size:14px;min-width:0;overflow:hidden}
.pd.done{background:#FFB3D2}
.pd.now{background:var(--pink);font-size:17px;transform:scale(1.18);box-shadow:0 0 0 3px #fff,0 0 0 6px #FFB3D2}
.coins{font-family:var(--display);font-size:22px;background:#FFF7D6;border:3px solid var(--butter);border-radius:18px;padding:8px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}

.main{display:grid;grid-template-columns:240px 1fr;gap:16px}
.stats{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:8px}
.grow{font-family:var(--display);font-size:17px;text-align:center;background:var(--pink-soft);border-radius:14px;padding:6px;color:var(--pink-deep)}
.tag{font-family:var(--display);font-size:16px;text-align:center;color:var(--ink-soft)}
.srow{display:grid;grid-template-columns:36px 1fr 32px;align-items:center;gap:8px}
.si{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.sn{font-family:var(--display);font-size:16px;line-height:1.2}
.bar{height:12px;border-radius:99px;background:#F3E8FA;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.sv{font-family:var(--display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.sep{height:2px;background:var(--line);border-radius:2px;margin-block:2px}
.mini-info{display:flex;justify-content:space-between;font-family:var(--display);font-size:16px;color:var(--ink-soft)}

.stage{position:relative;aspect-ratio:16/10;border-radius:30px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 0 var(--line-deep);background:var(--wall);container-type:size;
  --wall:#FFE6F0;--wall2:#FFD6E7;--floor:#F7C9DD;--win:#BFE8FF;--hw:31%}
.stage.s1{--wall:#E3F7F0;--wall2:#CFF0E4;--floor:#BDE8D7;--win:#8FD8FF}
.stage.s2{--wall:#FFF1DC;--wall2:#FFE3BD;--floor:#F2CFA2;--win:#FFD7A6}
.stage.s3{--wall:#E9EEFF;--wall2:#D8E0FF;--floor:#C8D3F4;--win:#DCE7FF}
.stage.g1{--hw:35%}.stage.g2{--hw:39%}
.wallp{position:absolute;inset:0;background-image:radial-gradient(var(--wall2) 5px,transparent 5.5px);background-size:44px 44px}
.window{position:absolute;left:7%;top:10%;width:22%;aspect-ratio:1/1.15;background:var(--win);border:10px solid #fff;border-radius:48% 48% 14px 14px;box-shadow:0 5px 0 #0001;overflow:hidden}
.window::before,.window::after{content:"";position:absolute;background:#fff}
.window::before{left:50%;top:0;bottom:0;width:7px;transform:translateX(-50%)}
.window::after{top:52%;left:0;right:0;height:7px}
.window .sun{position:absolute;right:10%;top:12%;font-size:clamp(18px,3vw,32px)}
.frame{position:absolute;right:8%;top:12%;width:15%;aspect-ratio:1;border-radius:50%;background:#fff;border:7px solid #FFC2DA;display:grid;place-items:center;font-size:clamp(22px,4vw,46px);box-shadow:0 5px 0 #0001}
.floor{position:absolute;left:0;right:0;bottom:0;height:27%;background:var(--floor);border-top:5px solid #fff8}
.rug{position:absolute;left:50%;bottom:5%;width:46%;height:15%;transform:translateX(-50%);border-radius:50%;background:#fff;opacity:.7;box-shadow:inset 0 0 0 8px #FFB3D2}
.fall{position:absolute;top:-10%;font-size:22px;animation:fall linear infinite;opacity:.8;pointer-events:none}
@keyframes fall{to{transform:translateY(125cqh) rotate(300deg)}}
.hero{position:absolute;left:50%;bottom:6%;width:var(--hw);transform:translateX(-50%);cursor:pointer;background:none;border:0;padding:0;transition:width .6s}
.bubble{position:absolute;left:50%;top:5%;transform:translateX(-50%);max-width:68%;background:#fff;border-radius:22px;padding:10px 18px;font-family:var(--display);font-size:clamp(16px,2.3vw,23px);text-align:center;box-shadow:0 5px 0 #0001;animation:bpop .3s ease-out;z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble:empty{display:none}
@keyframes bpop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.eatfx{position:absolute;left:50%;bottom:40%;font-size:54px;animation:eat 1s ease-out forwards;pointer-events:none;z-index:3}
@keyframes eat{0%{transform:translate(-50%,-60px) scale(1.2)}60%{transform:translate(-50%,0) scale(1)}100%{transform:translate(-50%,10px) scale(.2);opacity:0}}

.cmds{display:grid;grid-template-columns:1.7fr repeat(5,1fr);gap:12px;margin-top:16px}
.cmd{
  background:var(--card);border:3px solid var(--ac,var(--line-deep));border-bottom-width:8px;border-radius:24px;
  padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
  transition:transform .12s ease;
}
.cmd:hover{transform:translateY(-3px)}
.cmd:active{transform:translateY(3px);border-bottom-width:5px}
.cmd .ai{font-size:clamp(30px,4.4vw,44px);line-height:1.1}
.cmd .an{font-family:var(--display);font-size:clamp(16px,2vw,21px)}
.cmd.main{background:var(--pink);border-color:var(--pink-deep);color:#fff;flex-direction:row;gap:12px}
.cmd.main .ai{font-size:clamp(36px,5vw,54px)}
.cmd.main .an{font-size:clamp(22px,2.8vw,30px)}
.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px #FF5C9E33}}
.badge{position:absolute;top:-9px;right:-6px;background:var(--pink);color:#fff;font-family:var(--display);font-size:15px;min-width:26px;height:26px;border-radius:99px;display:grid;place-items:center;padding:0 6px;border:3px solid #fff}
@media (max-width:760px){
  .main{grid-template-columns:1fr}
  .stats{order:2}
  .stage{aspect-ratio:4/3}
  .cmds{grid-template-columns:repeat(3,1fr)}
  .cmd.main{grid-column:1/-1}
  .hud{flex-wrap:wrap}
  .path{order:5;flex-basis:100%}
}

/* ---------- 모달 ---------- */
#modal{position:fixed;inset:0;z-index:50;background:#4A2B5C66;display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{background:var(--card);border-radius:32px;width:100%;max-width:880px;padding:22px;box-shadow:0 12px 0 #4A2B5C33;animation:sheet .3s ease-out;position:relative}
.sheet.wide{max-width:960px}
@keyframes sheet{from{transform:translateY(24px) scale(.96);opacity:0}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-wrap:balance}
.center{text-align:center}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hint{text-align:center;color:var(--ink-soft);margin:8px 0 0;font-size:17px}
.note{margin-top:14px;background:#F3EEFF;border-radius:16px;padding:10px 16px;text-align:center;color:var(--ink-soft)}
.note.warn{background:#FFE9EF;color:#B03A5E}
.ghead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.gicon{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:34px;flex:none;background:var(--pink-soft)}
.gtitle{flex:1;min-width:0}
.gtitle p{margin:2px 0 0;font-size:19px;color:var(--ink-soft)}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tab{flex:1;font-family:var(--display);font-size:19px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:9px 6px;white-space:nowrap}
.tab.on{background:var(--pink);border-color:var(--pink-deep);color:#fff}

/* 칩 */
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--c);border-radius:20px;padding:6px 14px;font-family:var(--display);font-size:20px;animation:pop2 .4s ease-out backwards}
.chip em{font-style:normal;color:var(--c);font-size:26px;font-variant-numeric:tabular-nums}
.mcs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.mc{font-size:14px;background:#F6F0FB;border-radius:99px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mc.up{background:#E4F7EC}.mc.down{background:#FFE9EF}.mc.coin{background:#FFF2C4}

/* 일정 */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{border:3px dashed var(--line-deep);background:#FBF7FE;border-radius:22px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:112px;position:relative}
.slot.full{border-style:solid;border-color:var(--pink);background:var(--pink-soft)}
.slot .no{position:absolute;top:6px;left:12px;font-family:var(--display);color:var(--ink-soft);font-size:16px}
.slot .x{position:absolute;top:6px;right:10px;font-size:15px}
.slot .bigi{font-size:42px;line-height:1.1}
.slot .q{font-size:36px;color:var(--line-deep);font-family:var(--display)}
.slot .sl{font-family:var(--display);font-size:18px}
.budget{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.budget span{background:#F6F0FB;border-radius:14px;padding:6px 12px;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.budget .bad{background:#FFE3EA;color:#B03A5E}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.acard{background:#fff;border:3px solid var(--ac,var(--line-deep));border-bottom-width:7px;border-radius:20px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:transform .12s}
.acard:hover{transform:translateY(-2px)}
.acard:disabled{opacity:.42;transform:none}
.acard .ai{font-size:40px;line-height:1.1}
.acard .an{font-family:var(--display);font-size:19px}
.acard .lk{font-size:14px;color:#A0526E;font-family:var(--display)}

/* 활동 장면 */
.slot-pill{display:inline-block;background:var(--pink-soft);color:var(--pink-deep);font-family:var(--display);border-radius:99px;padding:3px 14px;font-size:17px}
.scene{position:relative;height:min(270px,38vh);border-radius:24px;overflow:hidden;margin-top:12px}
.scene .dc,.adv-scene .dc{position:absolute;font-size:clamp(28px,5vw,44px);opacity:.9}
.sc-hero{position:absolute;left:50%;bottom:4%;width:min(180px,34%);transform:translateX(-50%)}
.sc-prop{position:absolute;left:calc(50% + min(78px,15%));bottom:32%;font-size:clamp(34px,5vw,46px);animation:bob 1.6s ease-in-out infinite}
.ticker{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.ticker span{aspect-ratio:1;border-radius:12px;background:#F3E8FA;display:grid;place-items:center;font-size:clamp(14px,2.6vw,24px)}
.ticker span.on{background:#FFF4C2;animation:pop2 .3s}
.res-hero{width:130px;margin:0 auto}
.res-title{font-family:var(--display);font-size:40px;color:var(--pink);line-height:1.1}
.res-stars{font-size:38px;letter-spacing:6px}
.card2{margin:16px auto 0;max-width:440px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;border-radius:24px;padding:12px;text-align:left}
.card2 .cp2{width:96px}
.card2 b{font-family:var(--display);font-weight:400;font-size:23px;display:block}
.card2 small{display:block;color:var(--ink-soft);font-size:16px}
.card2 .btn{margin-top:6px}
.gift{background:#FFF7D6;border:3px solid var(--butter)}
.meet{background:#E6F8EE;border:3px solid #9FDDBB}
.hearts{letter-spacing:1px;font-size:17px}

/* 모험 */
.adv-path{position:relative;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;margin-bottom:10px}
.adv-path::before{content:"";position:absolute;left:34px;right:34px;top:50%;border-top:5px dotted var(--line-deep)}
.anode{position:relative;width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid var(--line-deep);display:grid;place-items:center;font-size:24px;z-index:1;transition:transform .2s}
.anode.done{background:var(--pink-soft);border-color:var(--pink)}
.anode.now{transform:scale(1.22);border-color:var(--pink);box-shadow:0 0 0 5px #FF5C9E33}
.adv-scene{position:relative;height:min(250px,34vh);border-radius:24px;overflow:hidden}
.adv-ev{position:absolute;right:14%;bottom:12%;font-size:clamp(56px,10vw,92px);line-height:1;animation:pop2 .4s}
.adv-ev .ping{width:clamp(90px,16vw,140px)}
.adv-hero{position:absolute;left:12%;bottom:4%;width:min(150px,28%)}
.adv-txt{font-family:var(--display);font-size:clamp(20px,2.8vw,26px);text-align:center;margin:14px 0 0;min-height:62px;text-wrap:balance}
.qbtn{font-size:44px;min-width:96px;height:90px;border-radius:24px;background:#fff;border:3px solid var(--line-deep);border-bottom-width:7px;font-family:var(--display)}

/* 대회 */
.cstage{position:relative;height:min(290px,40vh);border-radius:26px;overflow:hidden;background:linear-gradient(#5A3A7C,#8D5DB4);margin-top:12px}
.cstage .boards{position:absolute;left:0;right:0;bottom:0;height:24%;background:#C98A5A;border-top:6px solid #E2A878}
.curtain{position:absolute;top:0;bottom:0;width:52%;background:repeating-linear-gradient(90deg,#E8457E 0 22px,#D23068 22px 44px);z-index:3;transition:transform 1.4s ease-in-out}
.curtain.l{left:0}.curtain.r{right:0}
.cstage.open .curtain.l{transform:translateX(-92%)}
.cstage.open .curtain.r{transform:translateX(92%)}
.contestants{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;align-items:flex-end;gap:3%;z-index:2}
.cp{width:17%;position:relative}
.cp.me{width:24%}
.cp.me::before{content:"";position:absolute;left:-40%;right:-40%;bottom:0;height:260%;background:radial-gradient(ellipse at 50% 100%,#FFF6C8BB,#FFF6C800 62%);opacity:0;transition:opacity .6s}
.cstage.me-turn .cp.me::before{opacity:1}
.cmsg{font-family:var(--display);font-size:26px;text-align:center;margin:14px 0 0;min-height:38px}
.board{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.brow{display:grid;grid-template-columns:52px 84px 1fr 44px;align-items:center;gap:10px;padding:4px 8px;border-radius:16px}
.brow.me{background:var(--pink-soft)}
.brow .bp{width:52px}
.brow .bn{font-family:var(--display);font-size:18px}
.brow .bb{height:20px;border-radius:99px;background:#F3E8FA;overflow:hidden}
.brow .bb i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.8s cubic-bezier(.3,1,.4,1)}
.brow .bs{font-family:var(--display);font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.medal{font-size:100px;line-height:1;text-align:center;animation:pop2 .5s cubic-bezier(.3,1.6,.5,1);margin-top:10px}
.pick4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

/* 친구 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:12px}
.fcard{background:var(--fb,#fff);border:3px solid #fff;box-shadow:0 5px 0 var(--line);border-radius:22px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.fcard .fp{width:96px}
.fcard b{font-family:var(--display);font-weight:400;font-size:21px}
.fcard small{color:var(--ink-soft);font-size:14px}
.fcard.lock{background:#F6F1FA}
.fcard .row{margin-top:4px;gap:6px}
.snackpick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}

/* 상점, 옷장 */
.wallet{text-align:center;margin-bottom:10px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.item{background:#fff;border:3px solid var(--line);border-radius:20px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px;text-align:center}
.item .ip{width:74px}
.item .big{font-size:46px;height:74px;display:grid;place-items:center}
.item.on{border-color:var(--pink);background:var(--pink-soft)}
.item.lock{background:#F7F2FB;color:#B9A5C9;cursor:default}

let soundOn=true;
try{soundOn=localStorage.getItem('hpm_sound')!=='off'}catch(e){}
let koVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();koVoice=vs.find(v=>/^ko/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){
  if(!soundOn||!('speechSynthesis' in window)||!t)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/\p{Extended_Pictographic}|️|‍/gu,''));
    u.lang='ko-KR';if(koVoice)u.voice=koVoice;u.rate=.95;u.pitch=1.25;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
let AC=null;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d=.15,type='sine',vol=.14,delay=0){
  const a=ac();if(!a||!soundOn)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
  pop:()=>tone(880,.12,'triangle'),
  click:()=>tone(620,.06,'square',.04),
  soft:()=>tone(300,.18,'sine',.07),
  coin:()=>{tone(1320,.08,'square',.05);tone(1760,.16,'square',.05,.07)},
  chime:()=>[660,880,1320].forEach((f,i)=>tone(f,.28,'sine',.12,i*.08)),
  fanfare:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.32,'triangle',.13,i*.13)),
  drum:()=>{for(let i=0;i<18;i++)tone(140+(i%2)*30,.08,'square',.05,i*.1)},
};

/* 마우스를 올리면 읽어 주기 (글을 못 읽는 아이용) */
let hoverT=null,hoverEl=null;
document.addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse')return;
  const el=e.target.closest('[data-say]');
  if(!el||el===hoverEl)return;
  hoverEl=el;clearTimeout(hoverT);
  hoverT=setTimeout(()=>say(el.dataset.say),280);
});
document.addEventListener('pointerout',e=>{
  const el=e.target.closest('[data-say]');
  if(el&&!el.contains(e.relatedTarget)){if(hoverEl===el)hoverEl=null;clearTimeout(hoverT)}
});
document.addEventListener('click',e=>{const r=e.target.closest('[data-rep]');if(r)say(r.dataset.rep)});

/* =========================================================
   그림 (SVG)
   ========================================================= */
let uid=0;
function heartPath(cx,cy,s){return `M${cx},${cy+s*.9} C${cx-s*1.4},${cy+s*.05} ${cx-s*.85},${cy-s*1.05} ${cx},${cy-s*.35} C${cx+s*.85},${cy-s*1.05} ${cx+s*1.4},${cy+s*.05} ${cx},${cy+s*.9}Z`}
function starPath(cx,cy,r,ir=r*.45){let p='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?ir:r;p+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1)}return p+'Z'}
function symbolPath(t,cx,cy,s){
  switch(t){
    case 'star':return starPath(cx,cy,s*1.3);
    case 'drop':return `M${cx},${cy-s*1.25} C${cx+s*.6},${cy-s*.35} ${cx+s},${cy+s*.05} ${cx+s},${cy+s*.45} A${s},${s} 0 0 1 ${cx-s},${cy+s*.45} C${cx-s},${cy+s*.05} ${cx-s*.6},${cy-s*.35} ${cx},${cy-s*1.25}Z`;
    case 'leaf':return `M${cx},${cy-s*1.2} C${cx+s*1.15},${cy-s*.6} ${cx+s*.95},${cy+s*.75} ${cx},${cy+s*1.2} C${cx-s*.95},${cy+s*.75} ${cx-s*1.15},${cy-s*.6} ${cx},${cy-s*1.2}Z`;
    case 'bolt':return `M${cx+s*.25},${cy-s*1.25} L${cx-s*.75},${cy+s*.15} L${cx-s*.05},${cy+s*.15} L${cx-s*.35},${cy+s*1.25} L${cx+s*.8},${cy-s*.3} L${cx+s*.08},${cy-s*.3}Z`;
    case 'note':{const r=s*.5,x=cx-s*.3,y=cy+s*.7,sx=x+r-s*.18;
      return `M${x-r},${y} a${r},${r} 0 1 0 ${2*r},0 a${r},${r} 0 1 0 ${-2*r},0Z M${sx},${y} L${sx},${cy-s*1.2} L${sx+s*.3},${cy-s*1.2} Q${cx+s*1.1},${cy-s*.9} ${cx+s*.9},${cy-s*.1} Q${cx+s*.6},${cy-s*.6} ${sx+s*.3},${cy-s*.7} L${sx+s*.3},${y}Z`}
  }
  return heartPath(cx,cy,s);
}

function dressSVG(d,id){
  const it=ITEM[d];
  const base=(fill,stroke='#E0558F')=>`<path d="M70,160 Q100,150 130,160 L147,206 Q100,220 53,206Z" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
  const hem=(c='#fff',r=6.5)=>{let s='';for(let x=58;x<=142;x+=12){const y=206+7*(1-((x-100)/47)**2);s+=`<circle cx="${x}" cy="${y.toFixed(1)}" r="${r}" fill="${c}" opacity=".92"/>`}return s};
  const bow=(c='#FF4F8B')=>`<path d="${heartPath(100,160,8)}" fill="${c}" stroke="#fff" stroke-width="1.5"/>`;
  switch(d){
    case 'd_rainbow':return base(`url(#${id}r)`)+hem()+bow();
    case 'd_star':return base(it.color,'#8E74E8')+hem()+[[82,182],[112,176],[98,196],[126,196],[72,198]].map(([x,y])=>`<path d="${starPath(x,y,5)}" fill="#FFF6B0"/>`).join('')+bow('#FFD54F');
    case 'd_mermaid':{let s=base(it.color,'#2FA8C4');
      for(let y=172;y<=196;y+=12){const hw=30+(y-160)/46*17-6;for(let x=100-hw;x<=100+hw;x+=12)s+=`<path d="M${(x-6).toFixed(1)},${y} Q${x.toFixed(1)},${y+8} ${(x+6).toFixed(1)},${y}" stroke="#fff" stroke-width="2" fill="none" opacity=".85"/>`}
      return s+hem('#E8FBFF')+`<path d="${starPath(100,161,7)}" fill="#FFE27A" stroke="#fff" stroke-width="1.2"/>`}
    case 'd_cloud':return base('#FFFFFF','#9DB7E8')+hem('#DDE8FF',8.5)+[[84,180],[114,186]].map(([x,y])=>`<g fill="#EAF1FF"><circle cx="${x}" cy="${y}" r="6"/><circle cx="${x+7}" cy="${y-3}" r="7"/><circle cx="${x+14}" cy="${y}" r="6"/></g>`).join('')+bow('#8FB8FF');

function ping(o={}){

  s+=`<path d="${symbolPath(tuft,26,166,10)}" fill="${deep}"/><path d="${symbolPath(tuft,174,166,10)}" fill="${deep}"/>`;

  if(of.hand)s+=handSVG(of.hand);
  s+=`<circle cx="100" cy="100" r="62" fill="${body}" stroke="${deep}" stroke-width="3"/>`;

  else if(face==='happy')s+=`<g stroke="#3B2350" stroke-width="4.5" fill="none" stroke-linecap="round"><path d="M67,111 Q78,97 89,111"/><path d="M111,111 Q122,97 133,111"/></g>`;
  else s+=`<g fill="#3B2350"><ellipse cx="78" cy="106" rx="11" ry="14"/><ellipse cx="122" cy="106" rx="11" ry="14"/></g><g fill="#fff"><circle cx="74" cy="100" r="4.5"/><circle cx="118" cy="100" r="4.5"/><circle cx="82" cy="112" r="2"/><circle cx="126" cy="112" r="2"/></g>`;
  s+=`<g fill="#FF5C8A" opacity=".45"><ellipse cx="60" cy="124" rx="11" ry="6"/><ellipse cx="140" cy="124" rx="11" ry="6"/></g>`;
  if(face==='sleepy')s+=`<ellipse cx="100" cy="131" rx="4" ry="3.5" fill="#3B2350"/>`;
  else if(face==='happy')s+=`<path d="M89,123 Q100,142 111,123Z" fill="#FF7FA8" stroke="#3B2350" stroke-width="3" stroke-linejoin="round"/>`;
  else s+=`<path d="M92,126 Q100,137 108,126" stroke="#3B2350" stroke-width="3.5" fill="#FF7FA8" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(of.head)s+=headSVG(of.head);
  return s+'</svg>';
}

function openSchedule(){
  let plan=[],cat='learn';
  const m=openModal(`${headHTML('📅',`${monthName()} 일정 짜기`,'할 일 세 개를 골라요!')}
    <div class="slots" id="slots"></div><div class="budget" id="budget"></div>
    <div class="tabs" id="ctabs">${CATS.map(c=>`<button class="tab" data-c="${c.k}" data-say="${c.n}">${c.i} ${c.n}</button>`).join('')}</div>
    <div class="acards" id="acards"></div><div class="note warn" id="warn" hidden></div>
    <div class="row"><button class="btn" id="sBack" data-say="닫기">✖ 닫기</button><button class="btn pink big" id="sGo" data-say="시작">▶ 시작!</button></div>`,'wide');
  say(`${monthName()} 일정 짜기! 할 일 세 개를 골라요!`);
  const project=()=>{let c=S.coins,md=S.mood;for(const k of plan){const A=ACTS[k];if(A.cost)c-=A.cost;if(A.coin)c+=A.coin;md=clamp(md+(A.mood||0))}return {c,md}};
  const lockReason=A=>{
    if(A.unlockMi&&S.mi<A.unlockMi)return `🔒 ${monthName(A.unlockMi)}부터`;
    if(A.need)for(const [k,v] of Object.entries(A.need))if(S.stats[k]<v)return `🔒 ${ST[k].i} ${v} 필요`;
    if(A.cost&&project().c<A.cost)return '🪙 코인이 모자라요';
    return null;
  };
  function draw(){
    $('#slots',m).innerHTML=[0,1,2].map(i=>{
      const k=plan[i];
      if(!k)return `<div class="slot"><span class="no">${i+1}</span><span class="q">?</span><span class="sl" style="color:var(--ink-soft)">${ORDN[i]} 칸</span></div>`;
      const A=ACTS[k];
      return `<button class="slot full" data-rm="${i}" data-say="${A.n}. 누르면 빼요"><span class="no">${i+1}</span><span class="x">✖</span><span class="bigi">${A.i}</span><span class="sl">${A.n}</span></button>`;
    }).join('');
    const p=project();
    $('#budget',m).innerHTML=`<span data-say="코인">🪙 ${S.coins} → ${p.c}</span><span class="${p.md<20?'bad':''}" data-say="기분">💗 ${S.mood} → ${p.md}</span>`;
    m.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));
    $('#acards',m).innerHTML=Object.values(ACTS).filter(A=>A.cat===cat).map(A=>{
      const lk=lockReason(A);
      const col=A.gain?ST[Object.keys(A.gain)[0]].c:A.cat==='adv'?'#4EA8F5':MOOD_C;
      return `<button class="acard" data-k="${A.key}" style="--ac:${col}" ${lk||plan.length>=3?'disabled':''} data-say="${A.n}${lk?'. '+lk.replace(/[🔒🪙]/gu,''):''}"><span class="ai">${A.i}</span><span class="an">${A.n}</span>${effectChips(A)}${lk?`<span class="lk">${lk}</span>`:''}</button>`;
    }).join('');
    const w=$('#warn',m);w.hidden=!(plan.length&&p.md<20);
    w.textContent='💤 너무 바빠요! 🛏️ 쉬기를 넣으면 하츄핑이 기뻐해요.';
    $('#sGo',m).disabled=plan.length<3;
    m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{plan.splice(+b.dataset.rm,1);sfx.soft();draw()});
    m.querySelectorAll('.acard').forEach(b=>b.onclick=()=>{
      if(plan.length>=3)return;
      plan.push(b.dataset.k);sfx.click();
      say(plan.length===3?`${ACTS[b.dataset.k].n}. 다 골랐어요! 시작을 눌러요!`:ACTS[b.dataset.k].n);
      draw();
    });
  }
  m.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cat=b.dataset.c;sfx.click();draw()});
  $('#sBack',m).onclick=()=>{sfx.pop();closeModal()};
  $('#sGo',m).onclick=()=>{if(plan.length<3)return;sfx.chime();S.plan=plan;S.slot=0;saveRun();runMonth()};
  draw();
}

async function runMonth(){

function sceneHTML(A,x={}){
  return `<div class="scene" style="background:${A.bg}">${A.deco.map((d,j)=>`<span class="dc" style="left:${DECO_POS[j][0]}%;top:${DECO_POS[j][1]}%">${d}</span>`).join('')}<div class="sc-hero bob">${heroPing(x)}</div><span class="sc-prop">${A.prop}</span></div>`;
}
function applyAct(A,mult){
  const acc=newAcc(),tf=(S.mood<30&&A.cat!=='rest')?.7:1;
  for(const [k,v] of Object.entries(A.gain||{}))accStat(acc,k,Math.max(1,Math.round(v*mult*tf)));
  if(A.cost)accCoins(acc,-A.cost);
  if(A.coin)accCoins(acc,Math.round(A.coin*mult*tf));
  if(A.mood)accMood(acc,A.mood>0?Math.round(A.mood*mult):A.mood);
  if(A.pers)S.pers[A.pers]++;
  S.cnt[A.key]=(S.cnt[A.key]||0)+1;
  return acc;
}
function friendEncounter(fid){
  if(!fid)return null;
  const f=FR[fid];
  if(!(fid in S.friends)){if(Math.random()<.45){S.friends[fid]=1;return {f,first:true}}return null}
  if(S.friends[fid]<5&&Math.random()<.35){addHeart(fid);return {f,first:false}}
  return null;
}
async function runSlot(i){

  if(note){
    const m=openModal(`<div class="center"><div style="font-size:70px">${note.slice(0,2)}</div><h2>${note.slice(2)}</h2><div class="row"><button class="btn pink big" data-v="ok" data-say="알겠어요">알겠어요 ▶</button></div></div>`);

  const m=openModal(`<div class="center"><span class="slot-pill">${monthName()} · ${ORDN[i]} 칸</span><h2 style="margin-top:6px">${A.i} ${A.n}</h2></div>

  say(`${ORDN[i]} 칸, ${A.n}! ${isRest?'같이 해 볼까요?':'직접 해 볼까요?'}`);

  if(v==='play')score=await playGame(A.game);

    <div class="chips">${chipsHTML(res)}</div>
    ${tired?'<div class="note">💤 조금 졸려서 평소보다 덜 올랐어요. 쉬는 칸도 넣어 주세요!</div>':''}

async function ticker(m,great){

/* 빛나는 버튼 누르기 (춤, 물 주기) */
function padsGame(area,o){return new Promise(done=>{
  const idle=o.idle,fr=[523,659,784,988],N=12;
  area.innerHTML=`<div class="dg"><div class="dg-hero">${heroPing()}</div><div class="pads">${idle.map((c,i)=>`<button class="pad pad${i}" data-i="${i}" aria-label="버튼 ${i+1}">${c}</button>`).join('')}</div></div>`;
  const pads=[...area.querySelectorAll('.pad')],hero=$('.dg-hero',area);
  let beat=0,hits=0,lit=-1,prev=-1;
  pads.forEach(p=>p.onclick=()=>{
    const i=+p.dataset.i;
    if(i===lit){
      hits++;lit=-1;p.classList.remove('on');p.classList.add('hit');p.textContent=o.hit;
      tone(fr[i],.22,'triangle',.15);hop(hero);
      const r=area.getBoundingClientRect(),pr=p.getBoundingClientRect();floatFx(area,pr.left-r.left+pr.width/2,pr.top-r.top+10,o.fx||'✨');
      setTimeout(()=>{p.classList.remove('hit');p.textContent=idle[i]},420);
    }else sfx.soft();
  });
  function next(){
    pads.forEach((p,i)=>{if(p.classList.contains('on')){p.classList.remove('on');p.textContent=idle[i]}});
    if(beat>=N){setTimeout(()=>done(hits/N*10),500);return}
    let i;do{i=rand(4)}while(i===prev);
    prev=i;lit=i;pads[i].classList.add('on');if(o.lit)pads[i].textContent=o.lit;
    beat++;progress(beat/N);
    setTimeout(()=>{lit=-1;next()},1250);
  }
  setTimeout(next,600);
})}

/* 같은 그림 찾기 */
function memoryGame(area){return new Promise(done=>{
  const pairs=S&&S.mi>=6?6:4;
  const sy=shuffle(['🍓','⭐','🌙','🎀','🌷','🐰','🍰','🦋']).slice(0,pairs);
  const cards=shuffle([...sy,...sy]);
  area.innerHTML=`<div class="mem" style="max-width:${pairs===4?540:480}px">${cards.map((c,i)=>`<button class="card" data-i="${i}" aria-label="카드"><span class="back">💗</span><span class="face">${c}</span></button>`).join('')}</div>`;
  let first=null,lock=false,tries=0,found=0;
  area.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('open'))return;
    b.classList.add('open');sfx.click();
    if(!first){first=b;return}
    tries++;const a=first;first=null;
    if(cards[a.dataset.i]===cards[b.dataset.i]){
      found++;a.classList.add('got');b.classList.add('got');sfx.chime();progress(found/pairs);
      if(found===pairs)setTimeout(()=>done(Math.max(4,10-(tries-pairs)*(pairs===4?1:.7))),800);
    }else{lock=true;setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');lock=false},900)}
  });
})}

/* 떨어지는 것 받기 */
function catchGame(area,o){return new Promise(done=>{
  area.innerHTML=`<div class="cg" style="background:${o.bg}"><div class="catcher"><div class="bob">${heroPing()}</div><span class="bk">🧺</span></div></div>`;
  const box=$('.cg',area),catcher=$('.catcher',area);
  const TOTAL=18;let W=box.clientWidth,H=box.clientHeight,x=W/2,stars=[],spawned=0,caught=0,spawnT=400,last=performance.now(),keys={};
  const mv=e=>{const r=box.getBoundingClientRect();x=e.clientX-r.left};
  box.addEventListener('pointermove',mv);box.addEventListener('pointerdown',mv);
  const kd=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key]=true;e.preventDefault()}};
  const ku=e=>{keys[e.key]=false};
  addEventListener('keydown',kd);addEventListener('keyup',ku);
  function loop(t){
    const dt=Math.min(50,t-last);last=t;W=box.clientWidth;H=box.clientHeight;
    if(keys.ArrowLeft)x-=dt*.55;if(keys.ArrowRight)x+=dt*.55;
    x=Math.max(50,Math.min(W-50,x));catcher.style.left=x+'px';
    spawnT-=dt;
    if(spawned<TOTAL&&spawnT<=0){
      spawnT=1000;spawned++;progress(spawned/TOTAL);
      const el=document.createElement('span');el.className='fstar';el.textContent=pickOne(o.items);box.appendChild(el);
      stars.push({el,x:40+Math.random()*(W-80),y:-40,v:.11+Math.random()*.05});
    }
    for(const s of stars){
      s.y+=s.v*dt;s.el.style.transform=`translate(${s.x}px,${s.y}px)`;
      if(s.y>H-120&&s.y<H-30&&Math.abs(s.x-x)<60){s.done=true;caught++;s.el.classList.add('caught');tone(660+caught*25,.12,'triangle');setTimeout(()=>s.el.remove(),300)}
      else if(s.y>H){s.done=true;s.el.remove()}
    }
    stars=stars.filter(s=>!s.done);
    if(spawned>=TOTAL&&!stars.length){
      removeEventListener('keydown',kd);removeEventListener('keyup',ku);
      setTimeout(()=>done(caught/TOTAL*10),400);return;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})}

  const lens=S&&S.mi>=6?[3,4,5]:[2,3,4];let round=0,seq=[],pos=0,input=false,mistakes=0;
  function flash(k,d=460){btns[k].classList.add('on');tone(gems[k].f,.3,'sine',.15);setTimeout(()=>btns[k].classList.remove('on'),d)}
  function show(){

    setTimeout(()=>{input=true;pos=0;msg.textContent='이제 눌러 보세요! 👆';say('이제 눌러 보세요!')},t);
  }

      pos++;
      if(pos===seq.length){
        input=false;round++;progress(round/lens.length);hop(hero);setTimeout(sfx.chime,300);
        if(round>=lens.length){msg.textContent='마법 성공! ✨';setTimeout(()=>done(Math.max(3,10-mistakes*2)),1000)}
        else{msg.textContent='딩동댕! ✨';setTimeout(start,1300)}

  });
  setTimeout(start,500);
})}

/* 문질러 닦기 (청소) */
function rubGame(area){return new Promise(done=>{
  area.innerHTML=`<div class="rb"></div>`;
  const box=$('.rb',area),W=box.clientWidth,H=box.clientHeight,N=14,spots=[];
  for(let i=0;i<N;i++){
    const sz=48+rand(30),x=40+Math.random()*(W-80),y=40+Math.random()*(H-80);
    const el=document.createElement('div');el.className='dust';el.style.cssText=`left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px`;
    box.appendChild(el);spots.push({el,x,y,r:sz/2+12,hp:4,t:0});
  }
  const t0=performance.now();let left=N,fin=false;
  const rub=e=>{
    if(fin)return;const b=box.getBoundingClientRect(),px=e.clientX-b.left,py=e.clientY-b.top,now=performance.now();
    for(const s of spots){
      if(s.hp<=0||now-s.t<70||Math.hypot(px-s.x,py-s.y)>s.r)continue;
      s.t=now;s.hp--;s.el.style.opacity=s.hp/4;
      if(s.hp<=0){left--;progress((N-left)/N);tone(900+(N-left)*30,.1,'triangle',.08);floatFx(box,s.x,s.y,'✨');if(!left)finish()}
    }
  };
  box.addEventListener('pointermove',rub);box.addEventListener('pointerdown',rub);
  const timer=setTimeout(finish,30000);
  function finish(){
    if(fin)return;fin=true;clearTimeout(timer);
    const t=(performance.now()-t0)/1000;
    const sc=left>0?(N-left)/N*8:(t<=12?10:Math.max(5,10-(t-12)/3));
    sfx.chime();setTimeout(()=>done(sc),600);
  }
})}

function calcEnding(){
  const st=S.stats,c=S.cnt,vals=Object.values(st);
  if(vals.every(v=>v>=50))return 'queen';
  if(vals.every(v=>v>=35))return 'royal';
  if(FRIENDS.filter(f=>(S.friends[f.id]||0)>=5).length>=3)return 'friends';
  if(S.coins>=600)return 'rich';
  const spec=[['chef',(c.cook||0)+(c.bakery||0),5],['flower',c.flower||0,4],['teacher',c.baby||0,4],['explorer',S.advCount,4]]
    .filter(x=>x[1]>=x[2]).sort((a,b)=>b[1]-a[1]);
  if(spec.length)return spec[0][0];
  const order=STATS.slice().sort((a,b)=>st[b.k]-st[a.k]),top=order[0].k,second=order[1].k;
  switch(top){
    case 'art':return (c.art||0)>(c.dance||0)?'painter':'art';
    case 'magic':return second==='kind'?'fairy':'magic';
    case 'kind':return 'love';
    case 'charm':return 'fashion';
    default:return top;
  }
}

  const m=openModal(`${headHTML('📖','엔딩 도감',`${meta.endings.length} / ${ENDING_ORDER.length} 모았어요`)}
    <div class="book">${ENDING_ORDER.map(k=>{const E=ENDINGS[k],got=meta.endings.includes(k);
      return `<div class="ecard ${got?'':'lock'}" style="--eb:${E.bg}" data-say="${got?E.n:'아직 몰라요. 힌트, '+E.hint}"><div class="ei">${E.i}</div><b>${got?E.n:'???'}</b><small>💡 ${E.hint}</small></div>`}).join('')}</div>
    <p class="hint">👗 모은 옷 ${meta.owned.length} / ${ITEMS.length}</p>

/* =========================================================
   대화, 간식, 상점, 친구, 옷장
   ========================================================= */
const TALKS=[
  {k:'praise',n:'칭찬해 주기',i:'👏',c:'#E9A400'},
  {k:'hug',   n:'꼭 안아 주기',i:'🤗',c:'#FF5C9E'},
  {k:'listen',n:'이야기 듣기',i:'👂',c:'#4EA8F5'},
  {k:'height',n:'키 재기',    i:'📏',c:'#3DBB84'},
];
function listenLine(){
  const L={body:'요즘 뛰어노는 게 제일 신나요! 더 튼튼해지고 싶어요!',smart:'책 읽는 게 재밌어요! 궁금한 게 아주 많아요!',art:'노래하고 춤추는 게 제일 좋아요! 무대에 서 보고 싶어요!',
    magic:'반짝반짝 마법이 좋아요! 별을 만들어 보고 싶어요!',kind:'친구들을 도와주면 마음이 따뜻해져요!',charm:'예쁜 드레스를 입으면 진짜 공주님이 된 것 같아요!'};
  const opts=[];
  if(Object.values(S.stats).some(v=>v>0))opts.push(L[topStat()]);
  const notMet=FRIENDS.filter(f=>!(f.id in S.friends));
  if(notMet.length){const f=pickOne(notMet);opts.push(`${f.place}에 가면 ${josa(f.n,'을','를')} 만날 수 있대요!`)}
  if(S.mood<40)opts.push('조금 피곤해요… 소풍 가고 싶어요!');
  if(S.coins<20)opts.push('코인이 조금밖에 없어요. 아르바이트를 해 볼까요?');
  if(!Object.values(S.snacks).some(n=>n>0))opts.push('달콤한 간식이 먹고 싶어요! 🍰');
  if(!opts.length)opts.push('하츄핑은 오늘도 행복해요! 💗');
  return pickOne(opts);
}
async function openTalk(){
  if(S.talked){
    const m=openModal(`<div class="center"><div class="talk-top"><div class="tk-hero bob">${heroPing({face:'happy'})}</div><div class="say2">이번 달에는 벌써 이야기했어요. 다음 달에 또 이야기해요!</div></div><div class="row"><button class="btn pink" data-v="x">✔ 알겠어요</button></div></div>`);
    say('이번 달에는 벌써 이야기했어요. 다음 달에 또 이야기해요!');await pick(m);closeModal();return;
  }
  const m=openModal(`${headHTML('💬','하츄핑과 대화하기','한 달에 한 번 이야기할 수 있어요!')}
    <div class="talk-top"><div class="tk-hero bob" id="tkh">${heroPing()}</div><div class="say2" id="tks">무슨 이야기 할까요?</div></div>
    <div id="tkb"><div class="talk">${TALKS.map(t=>`<button class="acard" data-v="${t.k}" data-say="${t.n}" style="--ac:${t.c}"><span class="ai">${t.i}</span><span class="an">${t.n}</span></button>`).join('')}</div></div>`);
  say('하츄핑과 대화해요! 무엇을 할까요?');
  const v=await pick(m);
  S.talked=true;const acc=newAcc();let line='';
  if(v==='praise'){accMood(acc,10);accStat(acc,'charm',1);S.pers.grace++;line=pickOne(['헤헤, 칭찬 받으니까 기분 최고예요!','더 열심히 할게요! 💪','정말요? 나 잘했어요? 히히!'])}
  else if(v==='hug'){accMood(acc,18);S.pers.kind++;line=pickOne(['따뜻해요… 사랑해요 💗','꼬옥! 하츄핑도 꼬옥!','안아 주니까 하나도 안 피곤해요!'])}
  else if(v==='listen'){accMood(acc,6);line=listenLine()}
  else{accMood(acc,4);const d=+(S.height-S.heights[0]).toFixed(1);line=d>0?`키가 ${S.height}cm예요! 처음보다 ${d}cm나 컸어요!`:`키가 ${S.height}cm예요! 앞으로 쑥쑥 클 거예요!`}
  $('#tkh',m).innerHTML=heroPing({face:'happy'});hop($('#tkh',m));
  $('#tks',m).textContent=line;sfx.chime();
  const chart=v==='height'?`<div class="hchart">${S.heights.map((h,i)=>`<div style="height:${clamp((h-60)/55*100,4,100)}%"><span>${h}</span><em>${MONTHS[i]}월</em></div>`).join('')}</div>`:'';
  $('#tkb',m).innerHTML=`${chart}<div class="chips">${chipsHTML(acc)}</div><div class="row"><button class="btn pink" data-v="x" data-say="닫기">✔ 닫기</button></div>`;
  say(line);saveRun();
  await pick($('#tkb',m));closeModal();renderHome(false);
}
function openSnack(){
  const m=openModal(`${headHTML('🍪','간식 주기','하츄핑에게 간식을 줘요!')}
    <div class="talk-top" style="position:relative"><div class="tk-hero bob" id="skh" style="position:relative">${heroPing()}</div><div class="say2" id="sks">간식 주세요! 냠냠!</div></div>
    <div class="snacks" id="skl"></div>
    <div class="row"><button class="btn" id="skShop" data-say="상점 가기">🏪 상점 가기</button><button class="btn pink" id="skX" data-say="닫기">✔ 닫기</button></div>`);
  say('하츄핑에게 간식을 줘요!');
  function draw(){
    const have=SNACKS.filter(s=>S.snacks[s.id]>0);
    $('#skl',m).innerHTML=have.length?have.map(s=>`<button class="acard" data-s="${s.id}" data-say="${s.n}" style="--ac:#FF9466"><span class="ai">${s.i}</span><span class="an">${s.n} ×${S.snacks[s.id]}</span>${effectChips({gain:s.gain,mood:s.mood})}</button>`).join('')
      :`<div class="note" style="grid-column:1/-1">간식이 없어요. 🏪 상점에서 사 와요!</div>`;
    m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
      const s=SN[b.dataset.s];S.snacks[s.id]--;const acc=newAcc();accMood(acc,s.mood);for(const [k,v] of Object.entries(s.gain||{}))accStat(acc,k,v);
      const h=$('#skh',m);h.innerHTML=heroPing({face:'happy'});hop(h);
      const fx=document.createElement('span');fx.className='eatfx';fx.textContent=s.i;h.appendChild(fx);setTimeout(()=>fx.remove(),1000);
      const line=pickOne(['냠냠! 맛있어요!','우와, 최고로 맛있어요!','고마워요! 기운이 나요!']);
      $('#sks',m).textContent=line;sfx.chime();say(line);draw();
    });
  }
  draw();
  $('#skShop',m).onclick=()=>{sfx.pop();openShop('snack')};
  $('#skX',m).onclick=()=>{sfx.pop();saveRun();closeModal();renderHome(false)};
}
function openShop(tab='snack'){
  const m=openModal(`${headHTML('🏪','하츄핑 마을 상점','갖고 싶은 것을 골라요!')}
    <div class="wallet"><span class="coins" id="shc"></span></div>
    <div class="tabs"><button class="tab" data-t="snack" data-say="간식">🍰 간식</button><button class="tab" data-t="item" data-say="옷">👗 옷</button></div>
    <div id="shl"></div><div class="row"><button class="btn pink" id="shX" data-say="다 샀어요">✔ 다 샀어요</button></div>`,'wide');
  say('하츄핑 마을 상점이에요! 갖고 싶은 것을 골라요!');
  function draw(){
    $('#shc',m).textContent=`🪙 ${S.coins}`;
    m.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    const L=$('#shl',m);
    if(tab==='snack'){
      L.innerHTML=`<div class="items">${SNACKS.map(s=>`<div class="item" data-say="${s.n}, ${s.price}코인"><span class="big">${s.i}</span>${s.n}${effectChips({gain:s.gain,mood:s.mood})}<small>가진 것 ${S.snacks[s.id]||0}</small><button class="btn sm ${S.coins>=s.price?'pink':''}" data-buy="${s.id}" ${S.coins<s.price?'disabled':''}>🪙 ${s.price}</button></div>`).join('')}</div>`;
    }else{
      L.innerHTML=`<div class="items">${ITEMS.filter(t=>t.price).map(t=>{const own=meta.owned.includes(t.id);
        return `<div class="item ${own?'on':''}" data-say="${t.n}${own?', 있어요':', '+t.price+'코인'}"><span class="ip">${onlyItem(t.id)}</span>${t.n}${own?`<button class="btn sm" data-wear2="${t.id}">👗 입기</button>`:`<button class="btn sm ${S.coins>=t.price?'pink':''}" data-buyi="${t.id}" ${S.coins<t.price?'disabled':''}>🪙 ${t.price}</button>`}</div>`}).join('')}</div>`;
    }
    L.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const s=SN[b.dataset.buy];if(S.coins<s.price)return;S.coins-=s.price;S.snacks[s.id]=(S.snacks[s.id]||0)+1;sfx.coin();say(`${josa(s.n,'을','를')} 샀어요!`);saveRun();draw()});
    L.querySelectorAll('[data-buyi]').forEach(b=>b.onclick=()=>{const t=ITEM[b.dataset.buyi];if(S.coins<t.price)return;S.coins-=t.price;grant(t.id);sfx.coin();sfx.chime();say(`${josa(t.n,'을','를')} 샀어요! 입어 볼까요?`);saveRun();draw()});
    L.querySelectorAll('[data-wear2]').forEach(b=>b.onclick=()=>{const t=ITEM[b.dataset.wear2];meta.outfit[t.slot]=t.id;saveMeta();sfx.chime();say(`${josa(t.n,'을','를')} 입었어요!`);b.textContent='입었어요 ✔'});
  }
  m.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sfx.click();draw()});
  $('#shX',m).onclick=()=>{sfx.pop();saveRun();closeModal();renderHome(false)};
  draw();
}
function openFriends(){
  let gifting=null;
  const m=openModal(`${headHTML('👫','티니핑 친구들','친구랑 놀고 선물도 줘요!')}<div class="fgrid" id="fg"></div>
    <p class="hint">🎈 같이 놀기는 한 달에 한 번! 💗 다섯 개면 단짝 친구예요.</p>
    <div class="row"><button class="btn pink" id="fX" data-say="닫기">✔ 닫기</button></div>`,'wide');
  say('티니핑 친구들이에요!');
  const fg=$('#fg',m);
  function draw(){
    fg.innerHTML=FRIENDS.map(f=>{
      if(!(f.id in S.friends))return `<div class="fcard lock" data-say="아직 못 만났어요. ${f.where.replace(/\p{Extended_Pictographic}/gu,'')}에서 만날 수 있어요"><div class="fp">${ping({body:'#EDE6F3',deep:'#CDBEDB',tuft:f.tuft,mark:'#CDBEDB',stage:1})}</div><b>???</b><small>💡 ${f.where}</small></div>`;
      const h=S.friends[f.id],fav=SN[f.fav];
      let act;
      if(gifting===f.id){
        const have=SNACKS.filter(s=>S.snacks[s.id]>0);
        act=have.length?`<div class="snackpick">${have.map(s=>`<button class="btn sm" data-g="${s.id}" data-f="${f.id}" data-say="${s.n}">${s.i}×${S.snacks[s.id]}</button>`).join('')}</div>`:`<small>간식이 없어요. 상점에서 사 와요!</small>`;
      }else act=`<div class="row"><button class="btn sm" data-gift="${f.id}" data-say="선물 주기">🎁 선물</button><button class="btn sm" data-play="${f.id}" ${S.played?'disabled':''} data-say="같이 놀기">🎈 놀기</button></div>`;
      return `<div class="fcard" style="--fb:${f.bg}" data-say="${f.n}"><div class="fp bob" id="fp_${f.id}">${friendPing(f,{face:h>=5?'happy':''})}</div><b>${f.n}</b><span class="hearts">${heartsHTML(h)}</span><small>${h>=5?'💞 단짝 친구!':`좋아하는 간식: ${fav.i}`}</small>${act}</div>`;
    }).join('');
    fg.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{gifting=b.dataset.gift;sfx.click();draw()});
    fg.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
      const f=FR[b.dataset.f],s=SN[b.dataset.g];S.snacks[s.id]--;const n=s.id===f.fav?2:1;addHeart(f.id,n);gifting=null;
      sfx.chime();say(`${josa(f.n,'이','가')} 좋아해요!${n===2?' 제일 좋아하는 간식이래요!':''}`);draw();hop($('#fp_'+f.id,m));
    });
    fg.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{
      const f=FR[b.dataset.play];S.played=true;addHeart(f.id);addMood(12);
      sfx.fanfare();say(`${josa(f.n,'과','와')} 신나게 놀았어요! 하츄핑 기분도 좋아졌어요!`);draw();hop($('#fp_'+f.id,m));
    });
  }
  draw();
  $('#fX',m).onclick=()=>{sfx.pop();saveRun();closeModal();renderHome(false)};
}
function openCloset(){
  let tab='head';
  const m=openModal(`${headHTML('👗','하츄핑 옷장','옷을 눌러서 입혀 봐요!')}
    <div class="closet-grid"><div class="closet-prev"><div class="inner bob" id="cPrev"></div></div>
      <div><div class="tabs">${SLOTS.map(s=>`<button class="tab" data-t="${s.k}" data-say="${s.n}">${s.i} ${s.n}</button>`).join('')}</div><div class="items" id="cItems"></div></div></div>
    <div class="row"><button class="btn pink big" id="cDone" data-say="다 입었어요">✔ 다 입었어요</button></div>`,'wide');
  say('하츄핑 옷장이에요! 옷을 눌러서 입혀 봐요!');
  const prev=$('#cPrev',m),grid=$('#cItems',m);
  function draw(){
    prev.innerHTML=heroPing();
    m.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    grid.innerHTML=`<button class="item ${!meta.outfit[tab]?'on':''}" data-id="" data-say="안 입기"><span class="none">🚫</span>안 입기</button>`+
      ITEMS.filter(t=>t.slot===tab).map(t=>meta.owned.includes(t.id)
        ?`<button class="item ${meta.outfit[tab]===t.id?'on':''}" data-id="${t.id}" data-say="${t.n}"><span class="ip">${onlyItem(t.id)}</span>${t.n}</button>`
        :`<div class="item lock" data-say="아직 없어요. ${t.price?'상점에서 살 수 있어요':(SRC_TXT[t.src]||'').replace(/\p{Extended_Pictographic}/gu,'')}"><span class="q">?</span>${t.price?`🏪 ${t.price}`:SRC_TXT[t.src]}</div>`).join('');
    grid.querySelectorAll('button.item').forEach(b=>b.onclick=()=>{
      meta.outfit[tab]=b.dataset.id||null;saveMeta();sfx.chime();draw();hop(prev);
      say(b.dataset.id?ITEM[b.dataset.id].n+'! 예뻐요!':'벗었어요');
    });
  }
  m.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sfx.click();draw()});
  $('#cDone',m).onclick=()=>{sfx.pop();closeModal();renderHome(false);bubble('어때요? 예쁘죠? 💗')};
  draw();
}

renderTitle();
